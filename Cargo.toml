[workspace]
resolver = "2"
members = ["crates/cards", "crates/games", "crates/nn", "crates/big2", "crates/search", "crates/pybind"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
big2-cards = { path = "crates/cards" }
big2-games = { path = "crates/games" }
big2-nn = { path = "crates/nn" }
big2-big2 = { path = "crates/big2" }
big2-search = { path = "crates/search" }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"
web-time = "1"
proptest = "1.5"
criterion = { version = "0.5", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1  # keep symbols so profilers show function names
