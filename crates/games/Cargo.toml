[package]
name = "big2-games"
description = "Game-independent interfaces shared by every game and by the search solvers."
version.workspace = true
edition.workspace = true

[dependencies]
rand.workspace = true

# rand 0.8 -> getrandom 0.2 needs the js feature to compile for the browser (wasm32 only).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
