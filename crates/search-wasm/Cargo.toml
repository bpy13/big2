[package]
name = "big2-search-wasm"
description = "Timing harness for the Big Two search in Node WebAssembly and natively (plan Tasks 16 and 20). Never shipped: the app calls crates/app-api."
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
bench = false

[dependencies]
big2-big2.workspace = true
big2-games.workspace = true
big2-search.workspace = true
rand.workspace = true
# The same positions on wasm32 and 64-bit (SmallRng differs between them).
rand_chacha = "0.3"
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# The app's wasm-opt settings (crates/app-api/Cargo.toml), so the timings carry over.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
