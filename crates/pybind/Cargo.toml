[package]
name = "big2-pybind"
description = "Python bindings: the `big2._core` extension module."
version.workspace = true
edition.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]
bench = false

[dependencies]
big2-cards.workspace = true
big2-games.workspace = true
big2-big2.workspace = true
big2-search.workspace = true
rand.workspace = true
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
