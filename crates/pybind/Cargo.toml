[package]
name = "poker-pybind"
description = "Python bindings: the `poker._core` extension module."
version.workspace = true
edition.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]
bench = false

[dependencies]
poker-cards.workspace = true
poker-games.workspace = true
poker-big2.workspace = true
poker-search.workspace = true
rand.workspace = true
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
