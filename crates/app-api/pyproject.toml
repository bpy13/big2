# The Python binding of big2-app-api for the hk-games server (D15). Build it into the
# server's env with maturin, from this folder:
#   maturin develop --release --features python
# or from hk-games: server\engines\build.ps1 (builds every game's app-api).
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "big2-app-api"
version = "0.1.0"
description = "Big Two rules, bots and solver as JSON calls (hk-games engine interface v0)"
requires-python = ">=3.11"

[tool.maturin]
module-name = "big2_app_api"
features = ["python", "pyo3/extension-module"]
