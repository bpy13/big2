[package]
name = "big2-app-api"
description = "The app-facing adapter over the Big Two engine: JSON calls per hk-games docs/engine-interface.md, built to WebAssembly with wasm-bindgen."
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
bench = false

[dependencies]
big2-cards.workspace = true
big2-big2.workspace = true
big2-games.workspace = true
big2-search.workspace = true
rand.workspace = true
# Same random stream on every platform (SmallRng differs on wasm32), so the server can replay deals.
rand_chacha = "0.3"
# Instant that also works in the browser (performance.now()).
web-time.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The server's Python binding (hk-games D15). Off by default so the wasm build is unchanged;
# `--features python` adds the `big2_app_api.Big2Api` class (see README "Python binding").
pyo3 = { version = "0.30", optional = true, features = ["abi3-py311"] }

[features]
default = []
python = ["dep:pyo3"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
