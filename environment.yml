name: big2
# Works on macOS, Windows and Linux (conda-forge has builds of everything below).
# Windows also needs the Visual Studio Build Tools ("Desktop development with C++")
# for the Rust linker. For an NVIDIA GPU, run `make torch-cuda` before `make dev`.
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - rust>=1.82      # Rust compiler + cargo (kept inside the env; no global rustup)
  - nodejs=20       # for the React UI in web/
  - maturin>=1.7    # builds the Rust crates into the `big2._core` Python module
  - make            # runs the Makefile (Windows has no make of its own)
